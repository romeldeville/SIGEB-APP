name: Backend CI (SIGEB)

on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'backend/**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Maven tests (Flyway + Testcontainers PostgreSQL 16)
        run: mvn -B -f backend/pom.xml test

      - name: Package JAR
        run: mvn -B -f backend/pom.xml -DskipTests package
