services:
  db:
    image: postgres:16
    container_name: sigeb-db
    environment:
      POSTGRES_DB: sigeb
      POSTGRES_USER: sigeb_owner
      POSTGRES_PASSWORD: sigeb_owner_dev
    ports:
      - "5433:5432"
    volumes:
      - sigeb-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigeb_owner -d sigeb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sigeb-pgdata:
